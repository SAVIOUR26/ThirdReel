name: thirdreel
description: "Turn an audio file and a cover image into a video, fully offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new_min: ^3.6.2
  file_picker: ^12.3.0
  audioplayers: ^6.8.1
  desktop_drop: ^0.8.4
  path_provider: ^2.1.6
  path: ^1.9.1
  gal: ^2.3.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    icon_file: assets/icon/app_icon.ico
  image_path: assets/icon/app_icon_1024.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive_foreground_1024.png

flutter_native_splash:
  color: "#0B1220"
  image: assets/splash/splash_logo_1024.png
  android_12:
    image: assets/splash/splash_logo_1024.png
    color: "#0B1220"
